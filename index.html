<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>PurpleGreenish</title>

    <style>
@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

.fade-out { animation: fadeOut 0.6s forwards; }

@keyframes softPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(150,137,194,.18), 0 0 0 0 rgba(150,137,194,0); }
    50%      { box-shadow: 0 0 0 3px rgba(150,137,194,.28), 0 0 0 7px rgba(150,137,194,0); }
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #0a0d0b; color: #ddd; font-family: 'Courier New', monospace; font-size: 16px; overflow: hidden; user-select: none; }
#app { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
#app.sketch-mode { padding: 0; }
#sketch-root { position: absolute; inset: 0; overflow: hidden; background: #1f2a23; background-image: radial-gradient(circle at 50% 35%, #2b3a30 0%, #141b17 100%), radial-gradient(circle at 80% 80%, rgba(150,137,194,.04) 0%, transparent 60%), radial-gradient(circle at 20% 20%, rgba(64,131,87,.06) 0%, transparent 60%); touch-action: none; }

#sketch-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -150px;
    margin-left: -150px;
    background: #fdfaf3;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03);
    touch-action: none;
    cursor: crosshair;
    display: block;
    transform-origin: center center;
    will-change: transform;
}

#splash { position: fixed; inset: 0; background: #1f2a23; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.6s ease; }
#splash.fade-out { opacity: 0; pointer-events: none; }

#logo-wrap {
    position: relative;
    width: 120px; height: 120px;
    cursor: pointer;
    transform-origin: center center;
    transition: transform 0.15s ease-out;
    margin: 0;
    filter: drop-shadow(0 0 8px rgba(150,137,194,.35));
}
#logo-wrap svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; stroke: url(#logoGradient); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

#sketch-left, #sketch-right {
    transition: transform .28s cubic-bezier(.2,.8,.2,1),
                opacity 0.25s ease-out;
    will-change: transform, opacity;
}
#sketch-left {
    position: absolute; left: 0; top: 0; bottom: 0; width: 68px;
    background: #1a221d; border-right: 1px solid #263029;
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 0;
    transform: translateX(-100%);
    z-index: 20;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
}
#sketch-left.open { transform: translateX(0); }
#sketch-left.dimmed {
    opacity: 0;
    transition: transform .28s cubic-bezier(.2,.8,.2,1),
                opacity 0.25s ease-out;
}

#sketch-right {
    position: absolute; right: 0; top: 0; bottom: 0; width: 76px;
    background: #14181a; border-left: 1px solid #25282a;
    display: flex; flex-direction: column; gap: 8px; padding: 14px 0;
    transform: translateX(100%);
    z-index: 20;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
}
#sketch-right.open { transform: translateX(0); }
#sketch-right.dimmed {
    opacity: 0;
    transition: transform .28s cubic-bezier(.2,.8,.2,1),
                opacity 0.25s ease-out;
}

.sk-tool-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; border-radius: 12px; background: rgba(0,0,0,.25); transition: background .18s ease-out, transform .15s ease-out, box-shadow .2s ease-out; }
.sk-tool-btn svg { width: 23px; height: 23px; fill: none; stroke: rgb(64,131,87); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .18s ease-out; }
.sk-tool-btn.active { background: rgb(150,137,194); box-shadow: 0 0 0 3px rgba(150,137,194,.25), 0 4px 16px rgba(150,137,194,.4); transform: scale(1.06); }
.sk-tool-btn.active svg { stroke: #fff; }
.sk-tool-btn:active { transform: scale(.94); }

.sk-layer { width: 54px; height: 54px; margin: 0 auto; background: #1d2226; border: 2px solid #2c3236; border-radius: 10px; cursor: pointer; font-size: 11px; color: #6d7a72; display: flex; align-items: center; justify-content: center; position: relative; transition: border-color .2s ease-out, background .2s ease-out, transform .15s ease-out, opacity .3s ease-out; }
.sk-layer:active { transform: scale(.94); }
.sk-layer.active { border-color: rgb(150,137,194); background: #262b30; color: #fff; box-shadow: 0 0 0 2px rgba(150,137,194,.2); }
.sk-layer.hidden-layer { opacity: 0.25; background: transparent; border-style: dashed; }
.sk-layer .sk-eye { position: absolute; top: 1px; right: 2px; font-size: 16px; color: #6d7a72; padding: 4px; line-height: 1; }
.sk-layer.active .sk-eye { color: rgb(150,137,194); }
.sk-right-divider { height: 1px; background: #25282a; margin: 4px 12px; }

#sk-edge-left, #sk-edge-right { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 80px; border: none; color: #fff; font-size: 18px; cursor: pointer; z-index: 15; display: flex; align-items: center; justify-content: center; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .4s ease-out; }
#sk-edge-left { left: 0; background: rgba(64,131,87,.85); border-top-right-radius: 10px; border-bottom-right-radius: 10px; box-shadow: 2px 0 12px rgba(0,0,0,.35); }
#sk-edge-right { right: 0; background: rgba(60,58,72,.85); border-top-left-radius: 10px; border-bottom-left-radius: 10px; box-shadow: -2px 0 12px rgba(0,0,0,.35); }
#sk-edge-left.idle:not(.shift), #sk-edge-right.idle:not(.shift) { opacity: 0; }
#sk-edge-left.shift { transform: translate(68px, -50%); }
#sk-edge-right.shift { transform: translate(-76px, -50%); }

#sk-brush-panel { position: absolute; left: 0; right: 0; bottom: 0; background: #1a221d; border-top: 1px solid #263029; padding: 14px 16px calc(16px + env(safe-area-inset-bottom,0px)); transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); z-index: 22; box-shadow: 0 -4px 24px rgba(0,0,0,.4); }
#sk-brush-panel.open { transform: translateY(0); }
#sk-brush-panel h4 { color: #d0e0d5; font-size: 13px; margin-bottom: 10px; font-weight: normal; }
#sk-brush-panel .sk-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
#sk-brush-panel label { color: #9fb0a5; font-size: 12px; min-width: 100px; }
#sk-brush-panel input[type=range] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: #333; border-radius: 2px; }
#sk-brush-panel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: rgb(150,137,194); border-radius: 50%; cursor: pointer; }

.sk-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; width: 100%; }
.sk-toggle-row span { color: #9fb0a5; font-size: 12px; }
.sk-pulse-btn { width: 32px !important; height: 32px !important; border-radius: 50%; border: 2px solid #444; background: #222; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s ease-out, border-color 0.2s ease-out, box-shadow 0.2s ease-out; padding: 0; }
.sk-pulse-btn svg { width: 14px !important; height: 14px !important; stroke: #666; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s ease-out; }
.sk-pulse-btn .sk-check { display: none; stroke: #fff; }
.sk-pulse-btn.on { background: rgb(150,137,194); border-color: rgb(150,137,194); animation: softPulse 2.4s ease-in-out infinite; }
.sk-pulse-btn.on svg { stroke: #fff; }
.sk-pulse-btn.on .sk-cross { display: none; }
.sk-pulse-btn.on .sk-check { display: block; }

#sk-color-panel { position: absolute; left: 0; bottom: 0; width: 260px; max-width: 82vw; background: #1a221d; border-top-right-radius: 16px; padding: 14px 14px calc(60px + env(safe-area-inset-bottom,0px)) 14px; transform: translate(-110%, 110%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 24; box-shadow: 0 4px 24px rgba(0,0,0,.4); border: 1px solid #263029; border-left: none; border-bottom: none; }
#sk-color-panel.open { transform: translate(0, 0); }
#sk-color-panel h4 { color: #d0e0d5; font-size: 12px; margin-bottom: 10px; font-weight: normal; }
.sk-color-preview { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sk-color-preview-box { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #333; flex-shrink: 0; }
.sk-color-hex { flex: 1; background: #0f1512; color: #d0e0d5; border: 1px solid #2c3236; border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 13px; outline: none; min-width: 0; }
.sk-color-hex:focus { border-color: rgb(150,137,194); }
.sk-hsb-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sk-hsb-row label { color: #9fb0a5; font-size: 11px; width: 14px; }
.sk-hsb-slider { flex: 1; height: 8px; -webkit-appearance: none; appearance: none; border-radius: 4px; outline: none; cursor: pointer; }
.sk-hsb-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #fff; border: 2px solid #222; border-radius: 50%; cursor: pointer; }
#sk-hue-slider { background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
#sk-sat-slider { background: linear-gradient(to right, #808080, #f00); }
#sk-bri-slider { background: linear-gradient(to right, #000, #f00); }
.sk-color-label { color: #9fb0a5; font-size: 11px; margin-top: 10px; margin-bottom: 6px; }
.sk-preset-row, .sk-history-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.sk-preset-dot, .sk-history-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .15s ease-out, border-color .15s ease-out; flex-shrink: 0; }
.sk-preset-dot:hover, .sk-history-dot:hover { transform: scale(1.1); }
.sk-preset-dot.active, .sk-history-dot.active { border-color: rgb(150,137,194); }
.sk-history-empty { color: #6a7a70; font-size: 11px; font-style: italic; }

.sk-color-apply-btn { position: absolute; bottom: 15px; right: 15px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: rgb(150,137,194); color: #fff; border: none; border-radius: 50%; cursor: pointer; transition: transform 0.15s ease-out, background 0.15s ease-out; box-shadow: 0 4px 12px rgba(150,137,194,0.4); }
.sk-color-apply-btn:active { transform: scale(0.94); background: rgb(64,131,87); }
.sk-color-apply-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

#sk-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 18; opacity: 0; pointer-events: none; transition: opacity .25s ease-out; }
#sk-overlay.show { opacity: 1; pointer-events: auto; }
#sk-zoom-label { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(0,0,0,.55); color: #e6e6e6; font-size: 12px; padding: 5px 14px; border-radius: 20px; z-index: 15; pointer-events: none; transition: opacity .5s ease-out; letter-spacing: 0.5px; }
#sk-zoom-label.hide { opacity: 0; }
.error { color: #ff3333; font-size: 18px; padding: 20px; text-align: center; }

.save-slot {
    width: 48px;
    height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    transition: height .25s cubic-bezier(.2,.8,.2,1);
    margin: 0 auto;
}
.save-slot.open {
    height: 104px;
    margin-top: 8px;
    overflow: visible;
}
.save-btn {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.25);
    border-radius: 12px;
    color: rgb(64,131,87);
    border: none;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.4);
    transition: opacity .2s ease-out, transform .4s cubic-bezier(.34,1.56,.64,1), background .18s ease-out;
}
.save-btn:active { transform: scale(0.9); }
.save-btn svg {
    width: 23px; height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
}
.save-btn svg text {
    fill: currentColor;
    stroke: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.6px;
}
.save-slot.open .save-btn {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
}
.save-trigger.open {
    background: rgb(150,137,194);
    box-shadow: 0 0 0 3px rgba(150,137,194,.25), 0 4px 16px rgba(150,137,194,.4);
}
.save-trigger.open svg { stroke: #fff; }
.save-trigger { transition: background .18s ease-out, box-shadow .2s ease-out; }
.save-trigger svg { transition: stroke .18s ease-out; }

    </style>

<body>

    <div id="app"></div>

    <script>
var SKETCH_CONFIG = {
    beatMs: 1200,
    amplitude: 1.25,
    amplitudeBySize: { 1: 0.7, 2: 1.05, 3: 1.20 },
    edgeIdleMs: 2500,
    saveIdleMs: 3500,
    frameCount: 3,

    sizeMin: 1,
    sizeMax: 20,
    sizeDefault: 3,

    opacityMin: 20,
    opacityMax: 100,
    opacityDefault: 85,

    stabilizationMin: 0,
    stabilizationMax: 90,
    stabilizationDefault: 50,
    dynamicWidthDefault: false,

    canvasPercent: 0.78,
    zoomMin: 0.4,
    zoomMax: 5,

    gifSize: 500,
    gifDelayMs: 1200,
    colorHistoryMax: 10,

    brushes: [
        { id: 'pencil', name: 'карандаш', lineCap: 'round', widthMul: 1.0, doublePass: false },
        { id: 'marker', name: 'маркер', lineCap: 'butt', widthMul: 1.5, doublePass: false },
        { id: 'brush', name: 'кисть', lineCap: 'round', widthMul: 2.0, doublePass: true }
    ],

    presets: [
        { id: 'soft-gray',  name: 'серый',   color: '#9a9a9a' },
        { id: 'soft-violet', name: 'фиолетовый', color: 'rgb(150,137,194)' },
        { id: 'soft-green', name: 'зелёный', color: '#6fa980' }
    ]
};

var MANIFEST = {
    modules: ['Sketch']
};

var GifEncoder = {
    loaded: true,

    encode: function(canvases, delayMs) {
        if (!canvases || canvases.length === 0) return null;
        var w = canvases[0].width;
        var h = canvases[0].height;
        var frameCount = canvases.length;

        var allFrames = [];
        var allPixels = [];

        for (var c = 0; c < frameCount; c++) {
            var ctx = canvases[c].getContext('2d');
            var data = ctx.getImageData(0, 0, w, h).data;
            var pixels = new Array(w * h);
            for (var i = 0, p = 0; i < data.length; i += 4, p++) {
                var r = data[i];
                var g = data[i + 1];
                var b = data[i + 2];
                pixels[p] = { r: r, g: g, b: b };
                allPixels.push(pixels[p]);
            }
            allFrames.push(pixels);
        }

        var palette = this._medianCut(allPixels, 256);

        var indexedFrames = [];
        for (var f = 0; f < frameCount; f++) {
            var px = allFrames[f];
            var idx = new Uint8Array(px.length);
            for (var j = 0; j < px.length; j++) {
                idx[j] = this._nearestIndex(palette, px[j]);
            }
            indexedFrames.push(idx);
        }

        return this._buildGif(indexedFrames, palette, w, h, delayMs || 1200);
    },

    _medianCut: function(pixels, maxColors) {
        if (pixels.length === 0) return [{ r: 0, g: 0, b: 0 }];
        var buckets = [this._makeBucket(pixels)];
        while (buckets.length < maxColors) {
            var bestIdx = -1;
            var bestRange = 0;
            for (var i = 0; i < buckets.length; i++) {
                var b = buckets[i];
                if (b.pixels.length < 2) continue;
                var range = Math.max(b.rMax - b.rMin, b.gMax - b.gMin, b.bMax - b.bMin);
                if (range > bestRange) { bestRange = range; bestIdx = i; }
            }
            if (bestIdx === -1) break;
            var bucket = buckets[bestIdx];
            var rRange = bucket.rMax - bucket.rMin;
            var gRange = bucket.gMax - bucket.gMin;
            var bRange = bucket.bMax - bucket.bMin;
            var channel = 'r';
            if (gRange >= rRange && gRange >= bRange) channel = 'g';
            else if (bRange >= rRange && bRange >= gRange) channel = 'b';
            bucket.pixels.sort(function(a, b) { return a[channel] - b[channel]; });
            var mid = Math.floor(bucket.pixels.length / 2);
            var left = bucket.pixels.slice(0, mid);
            var right = bucket.pixels.slice(mid);
            buckets[bestIdx] = this._makeBucket(left);
            buckets.push(this._makeBucket(right));
        }
        var palette = [];
        for (var k = 0; k < buckets.length; k++) {
            var bk = buckets[k];
            if (bk.pixels.length === 0) { palette.push({ r: 0, g: 0, b: 0 }); continue; }
            var sr = 0, sg = 0, sb = 0;
            for (var m = 0; m < bk.pixels.length; m++) {
                sr += bk.pixels[m].r;
                sg += bk.pixels[m].g;
                sb += bk.pixels[m].b;
            }
            palette.push({
                r: Math.round(sr / bk.pixels.length),
                g: Math.round(sg / bk.pixels.length),
                b: Math.round(sb / bk.pixels.length)
            });
        }
        return palette;
    },

    _makeBucket: function(pixels) {
        if (pixels.length === 0) return { pixels: [], rMin: 0, rMax: 0, gMin: 0, gMax: 0, bMin: 0, bMax: 0 };
        var rMin = 255, rMax = 0, gMin = 255, gMax = 0, bMin = 255, bMax = 0;
        for (var i = 0; i < pixels.length; i++) {
            var p = pixels[i];
            if (p.r < rMin) rMin = p.r;
            if (p.r > rMax) rMax = p.r;
            if (p.g < gMin) gMin = p.g;
            if (p.g > gMax) gMax = p.g;
            if (p.b < bMin) bMin = p.b;
            if (p.b > bMax) bMax = p.b;
        }
        return { pixels: pixels, rMin: rMin, rMax: rMax, gMin: gMin, gMax: gMax, bMin: bMin, bMax: bMax };
    },

    _nearestIndex: function(palette, color) {
        var best = 0;
        var bestDist = Infinity;
        for (var i = 0; i < palette.length; i++) {
            var p = palette[i];
            var dr = p.r - color.r;
            var dg = p.g - color.g;
            var db = p.b - color.b;
            var dist = dr * dr + dg * dg + db * db;
            if (dist < bestDist) { bestDist = dist; best = i; }
        }
        return best;
    },

    _buildGif: function(frames, palette, w, h, delayMs) {
        var out = [];
        out.push(0x47, 0x49, 0x46, 0x38, 0x39, 0x61);
        out.push(w & 0xFF, (w >> 8) & 0xFF);
        out.push(h & 0xFF, (h >> 8) & 0xFF);
        out.push(0xF7, 0x00, 0x00);
        for (var i = 0; i < 256; i++) {
            var col = palette[i] || { r: 0, g: 0, b: 0 };
            out.push(col.r, col.g, col.b);
        }
        out.push(0x21, 0xFF, 0x0B);
        var appId = [0x4E, 0x45, 0x54, 0x53, 0x43, 0x41, 0x50, 0x45, 0x32, 0x2E, 0x30];
        for (var a = 0; a < appId.length; a++) out.push(appId[a]);
        out.push(0x03, 0x01, 0x00, 0x00, 0x00);
        var delayCs = Math.round(delayMs / 10);
        for (var f = 0; f < frames.length; f++) {
            out.push(0x21, 0xF9, 0x04);
            out.push(0x04);
            out.push(delayCs & 0xFF, (delayCs >> 8) & 0xFF);
            out.push(0x00);
            out.push(0x00);
            out.push(0x2C);
            out.push(0x00, 0x00, 0x00, 0x00);
            out.push(w & 0xFF, (w >> 8) & 0xFF);
            out.push(h & 0xFF, (h >> 8) & 0xFF);
            out.push(0x00);
            var lzw = this._lzwEncode(frames[f], 8);
            out.push(0x08);
            var off = 0;
            while (off < lzw.length) {
                var chunk = Math.min(255, lzw.length - off);
                out.push(chunk);
                for (var k = 0; k < chunk; k++) out.push(lzw[off + k]);
                off += chunk;
            }
            out.push(0x00);
        }
        out.push(0x3B);
        var bin = '';
        for (var bi = 0; bi < out.length; bi++) {
            bin += String.fromCharCode(out[bi] & 0xFF);
        }
        return btoa(bin);
    },

    _lzwEncode: function(indices, minCodeSize) {
        var CLEAR = 1 << minCodeSize;
        var END = CLEAR + 1;
        var codeSize = minCodeSize + 1;
        var out = [];
        var bitBuf = 0;
        var bitCount = 0;
        function pushCode(code) {
            bitBuf |= (code << bitCount);
            bitCount += codeSize;
            while (bitCount >= 8) {
                out.push(bitBuf & 0xFF);
                bitBuf >>= 8;
                bitCount -= 8;
            }
        }
        var dict = {};
        var nextCode = END + 1;
        function reset() {
            dict = {};
            nextCode = END + 1;
            codeSize = minCodeSize + 1;
        }
        pushCode(CLEAR);
        if (indices.length === 0) {
            pushCode(END);
            if (bitCount > 0) out.push(bitBuf & 0xFF);
            return out;
        }
        var prefix = indices[0];
        for (var i = 1; i < indices.length; i++) {
            var ch = indices[i];
            var key = prefix + ',' + ch;
            if (dict[key] !== undefined) {

            this.colorPanel.classList.add('open');
        }
    },
    _closeColorPanel: function() { if (this.colorPanel) this.colorPanel.classList.remove('open'); },

    _toggleSavePanel: function() {
        if (!this.saveSlot || !this.saveTrigger) return;
        if (this.saveSlot.classList.contains('open')) {
            this._closeSavePanel();
            return;
        }
        this.saveSlot.classList.add('open');
        this.saveTrigger.classList.add('open');
        this._scheduleSaveClose();
    },
    _scheduleSaveClose: function() {
        if (this.saveTimer !== null) { clearTimeout(this.saveTimer); this.saveTimer = null; }
        var self = this;
        this.saveTimer = setTimeout(function() { self.saveTimer = null; self._closeSavePanel(); }, SKETCH_CONFIG.saveIdleMs);
    },
    _closeSavePanel: function() {
        if (this.saveTimer !== null) { clearTimeout(this.saveTimer); this.saveTimer = null; }
        if (this.saveSlot) this.saveSlot.classList.remove('open');
        if (this.saveTrigger) this.saveTrigger.classList.remove('open');
    },

    _bindInput: function() {
        var self = this;
        window.addEventListener('resize', function() { self._resize(); });
        this.canvas.addEventListener('pointerdown', function(e) { self._onPointerDown(e); });
        this.root.addEventListener('pointerdown', function(e) { self._onPointerDown(e); });
        window.addEventListener('pointermove', function(e) { self._onPointerMove(e); });
        window.addEventListener('pointerup', function(e) { self._onPointerUp(e); });
        window.addEventListener('pointercancel', function(e) { self._onPointerUp(e); });
    },

    _onPointerDown: function(e) {
        if (e.clientX < 48 || e.clientX > window.innerWidth - 48) this._wakeEdges();
        if (e.target.closest && e.target.closest(this.uiSelector)) return;
        this.activePointers[e.pointerId] = { x: e.clientX, y: e.clientY, t: Date.now(), moved: 0, startX: e.clientX, startY: e.clientY };
        var ids = Object.keys(this.activePointers);

        else if (ids.length === 2) {
            this._cancelStroke(); var a = this.activePointers[ids[0]], b = this.activePointers[ids[1]];
            this.twoFingerStart = {
                dist: this._dist(a, b),
                angle: Math.atan2(b.y - a.y, b.x - a.x),
                cx: (a.x + b.x) / 2,
                cy: (a.y + b.y) / 2,
                scale: this.targetScale,
                rotation: this.targetRotation,
                tx: this.targetTx,
                ty: this.targetTy
            };
        }
    },

    _onPointerMove: function(e) {
        var p = this.activePointers[e.pointerId];
        if (!p) { if (this.drawing && e.target === this.canvas) this._moveStroke(e); return; }
        var dx = e.clientX - p.x, dy = e.clientY - p.y; p.moved += Math.sqrt(dx * dx + dy * dy); p.x = e.clientX; p.y = e.clientY;
        var ids = Object.keys(this.activePointers);
        if (this.drawing && ids.length === 1) { this._moveStroke(e); }
        else if (ids.length === 2 && this.twoFingerStart) {
            var a = this.activePointers[ids[0]], b = this.activePointers[ids[1]];
            var newDist = this._dist(a, b), newAngle = Math.atan2(b.y - a.y, b.x - a.x);
            var newCx = (a.x + b.x) / 2, newCy = (a.y + b.y) / 2;

            var start = this.twoFingerStart;
            var s = start.dist > 0 ? (newDist / start.dist) : 1;

            this.targetScale = Math.max(SKETCH_CONFIG.zoomMin, Math.min(SKETCH_CONFIG.zoomMax, start.scale * s));

            var deltaAngle = newAngle - start.angle;
            if (deltaAngle > Math.PI) deltaAngle -= Math.PI * 2;
            if (deltaAngle < -Math.PI) deltaAngle += Math.PI * 2;

            this.targetRotation = start.rotation + (deltaAngle * 180 / Math.PI);

            this.targetTx = start.tx + (newCx - start.cx);
            this.targetTy = start.ty + (newCy - start.cy);
        }
    },

    _onPointerUp: function(e) {
        var p = this.activePointers[e.pointerId]; if (!p) return;
        var ids = Object.keys(this.activePointers);
        if (this.drawing) this._endStroke();
        if (ids.length === 2) {
            var all = []; for (var k = 0; k < ids.length; k++) all.push(this.activePointers[ids[k]]);
            if (all[0].moved < 12 && all[1].moved < 12 && (Date.now() - all[0].t) < 400 && (Date.now() - all[1].t) < 400) this._undo();
        }
        delete this.activePointers[e.pointerId];
        if (Object.keys(this.activePointers).length < 2) { this.twoFingerStart = null; }
    },

    _dist: function(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); },
    _cancelStroke: function() { this.drawing = false; this.current = null; this._redraw(); },

    _canvasPoint: function(clientX, clientY) {
        var rect = this.canvas.getBoundingClientRect();
        var cx = clientX - (rect.left + rect.width / 2), cy = clientY - (rect.top + rect.height / 2);
        var rad = -this.targetRotation * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
        var rx = cx * cos - cy * sin, ry = cx * sin + cy * cos;
        return { x: (rx / this.targetScale) + this.baseSize / 2, y: (ry / this.targetScale) + this.baseSize / 2 };
    },

    _startStroke: function(e) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        var pt = this._canvasPoint(e.clientX, e.clientY);
        this.drawing = true;
        var brush = this._getBrush();
        this.current = { color: this.currentColor, size: this.currentSize, opacity: this.currentOpacity, brushId: brush.id, dynamicWidth: this.dynamicWidth, points: [this._makePoint(pt.x, pt.y, this.currentSize)] };
        this._redraw();
    },

    _moveStroke: function(e) {
        var pt = this._canvasPoint(e.clientX, e.clientY);
        if (!this.current) return;
        var pts = this.current.points, last = pts[pts.length - 1];

        var targetX = pt.x, targetY = pt.y;
        if (this.currentStabilization > 0) {
            var lerp = 1 - (this.currentStabilization / 100);
            targetX = last.bx + (pt.x - last.bx) * lerp;
            targetY = last.by + (pt.y - last.by) * lerp;
        }

        var dx = targetX - last.bx, dy = targetY - last.by;
        if (dx * dx + dy * dy < 4) return;
        pts.push(this._makePoint(targetX, targetY, this.current.size));

        var brush = this._getBrush(), color = this._resolveColor(this.current.color, this.current.opacity);
        this.ctx.strokeStyle = color; this.ctx.lineWidth = this.current.size * brush.widthMul; this.ctx.lineCap = brush.lineCap;
        this.ctx.beginPath(); this.ctx.moveTo(last.bx, last.by); this.ctx.lineTo(targetX, targetY); this.ctx.stroke();
    },

    _endStroke: function() {
        this.drawing = false;
        if (this.current && this.current.points.length > 0) {
            this.layers[this.activeLayerIndex].strokes.push(this.current);
        }
        this.current = null; this._redraw();
    },

    _ampFor: function(size) {
        var m = SKETCH_CONFIG.amplitudeBySize[size];
        return m !== undefined ? m : SKETCH_CONFIG.amplitude;
    },

    _makePoint: function(x, y, size) {
        var amp = this._ampFor(size);
        var offs = [];
        for (var f = 0; f < SKETCH_CONFIG.frameCount; f++) {
            offs.push({ x: (Math.random() * 2 - 1) * amp, y: (Math.random() * 2 - 1) * amp });
        }
        return { bx: x, by: y, offs: offs };
    },

    _hexToRgba: function(hex, alpha) {
        var r = 0, g = 0, b = 0;
        if (hex.charAt(0) === '#') hex = hex.substring(1);
        if (hex.length === 3) { r = parseInt(hex.charAt(0) + hex.charAt(0), 16); g = parseInt(hex.charAt(1) + hex.charAt(1), 16); b = parseInt(hex.charAt(2) + hex.charAt(2), 16); }
        else { r = parseInt(hex.substring(0, 2), 16); g = parseInt(hex.substring(2, 4), 16); b = parseInt(hex.substring(4, 6), 16); }
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    },
    _resolveColor: function(color, alpha) { return color.indexOf('rgb(') === 0 ? color.substring(0, color.length - 1) + ',' + alpha + ')' : this._hexToRgba(color, alpha); },
    _findBrush: function(id) {
        var brs = SKETCH_CONFIG.brushes;
        for (var i = 0; i < brs.length; i++) if (brs[i].id === id) return brs[i];
        return brs[0];
    },
    _getBrush: function() { return this._findBrush(this.currentBrush); },

    _resize: function() {
        if (!this.canvas) return;
        this.baseSize = Math.min(window.innerWidth, window.innerHeight) * SKETCH_CONFIG.canvasPercent;
        this.dpr = window.devicePixelRatio || 1;

        this.canvas.style.width = this.baseSize + 'px';
        this.canvas.style.height = this.baseSize + 'px';

        this.canvas.style.marginTop = (-this.baseSize / 2) + 'px';
        this.canvas.style.marginLeft = (-this.baseSize / 2) + 'px';

        this.canvas.width = Math.round(this.baseSize * this.dpr);
        this.canvas.height = Math.round(this.baseSize * this.dpr);

        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';

        this._redraw();
    },

    _beat: function() {
        var total = 0; for (var i = 0; i < this.layers.length; i++) total += this.layers[i].strokes.length;
        if (total === 0 && !this.current) return;
        this.phaseIdx = (this.phaseIdx + 1) % SKETCH_CONFIG.frameCount;
        if (!this.drawing) this._redraw();
    },

    _redraw: function() {
        if (!this.ctx) return;
        this.ctx.save(); this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); this.ctx.clearRect(0, 0, this.baseSize, this.baseSize); this.ctx.restore();
        for (var i = 0; i < this.layers.length; i++) {
            if (!this.layers[i].visible) continue;
            var strokes = this.layers[i].strokes;
            for (var s = 0; s < strokes.length; s++) this._drawStroke(strokes[s]);
        }
        if (this.current) this._drawStroke(this.current);
    },

    _drawStroke: function(st) {
        var pts = st.points, n = pts.length; if (n === 0) return;
        var brush = this._findBrush(st.brushId);

        var color = this._resolveColor(st.color, st.opacity);
        var baseWidth = st.size * brush.widthMul;
        var useDynamic = st.dynamicWidth;

        this.ctx.strokeStyle = color; this.ctx.fillStyle = color; this.ctx.lineCap = brush.lineCap;

        if (n === 1) {
            var p0 = pts[0], o0 = p0.offs[this.phaseIdx] || { x: 0, y: 0 };
            this.ctx.lineWidth = baseWidth;
            this.ctx.beginPath(); this.ctx.arc(p0.bx + o0.x, p0.by + o0.y, baseWidth / 2, 0, Math.PI * 2); this.ctx.fill(); return;
        }

        if (brush.doublePass) {
            this.ctx.lineWidth = baseWidth;
            this.ctx.beginPath(); var pA = pts[0], oA = pA.offs[this.phaseIdx] || { x: 0, y: 0 };
            this.ctx.moveTo(pA.bx + oA.x, pA.by + oA.y);
            for (var a = 1; a < n; a++) { pA = pts[a]; oA = pA.offs[this.phaseIdx] || { x: 0, y: 0 }; this.ctx.lineTo(pA.bx + oA.x, pA.by + oA.y); }
            this.ctx.stroke();
            this.ctx.strokeStyle = this._resolveColor(st.color, st.opacity * 0.5); this.ctx.lineWidth = baseWidth * 0.6;
            this.ctx.beginPath(); var pB = pts[0], oB = pB.offs[this.phaseIdx] || { x: 0, y: 0 };
            this.ctx.moveTo(pB.bx + oB.x, pB.by + oB.y);
            for (var b = 1; b < n; b++) { pB = pts[b]; oB = pB.offs[this.phaseIdx] || { x: 0, y: 0 }; this.ctx.lineTo(pB.bx + oB.x, pB.by + oB.y); }
            this.ctx.stroke(); return;
        }

        if (useDynamic) {
            this.ctx.lineCap = 'round';
            for (var i = 1; i < n; i++) {
                var p1 = pts[i-1], o1 = p1.offs[this.phaseIdx] || { x: 0, y: 0 };
                var p2 = pts[i], o2 = p2.offs[this.phaseIdx] || { x: 0, y: 0 };
                var t = i / n; var taper = Math.sin(t * Math.PI);
                this.ctx.lineWidth = Math.max(0.5, baseWidth * (0.2 + 0.8 * taper));
                this.ctx.beginPath(); this.ctx.moveTo(p1.bx + o1.x, p1.by + o1.y); this.ctx.lineTo(p2.bx + o2.x, p2.by + o2.y); this.ctx.stroke();
            }
            return;
        }

        this.ctx.lineWidth = baseWidth;
        this.ctx.beginPath(); var p = pts[0], o = p.offs[this.phaseIdx] || { x: 0, y: 0 };
        this.ctx.moveTo(p.bx + o.x, p.by + o.y);
        for (var j = 1; j < n; j++) { p = pts[j]; o = p.offs[this.phaseIdx] || { x: 0, y: 0 }; this.ctx.lineTo(p.bx + o.x, p.by + o.y); }
        this.ctx.stroke();
    },

    _undo: function() {
        var strokes = this.layers[this.activeLayerIndex].strokes;
        if (strokes.length === 0) return;
        strokes.pop(); this._redraw();
    },

    _exportPng: function() {
        try {
            var exportCanvas = document.createElement('canvas');
            exportCanvas.width = this.canvas.width; exportCanvas.height = this.canvas.height;
            var ectx = exportCanvas.getContext('2d');
            ectx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
            ectx.fillStyle = '#fdfaf3'; ectx.fillRect(0, 0, this.baseSize, this.baseSize);
            ectx.lineCap = 'round'; ectx.lineJoin = 'round';
            this._renderFrameTo(ectx, 0);
            var url = exportCanvas.toDataURL('image/png');
            var a = document.createElement('a'); a.href = url; a.download = 'sketch-' + Date.now() + '.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        } catch (e) { }
    },

    _exportGif: function() {
        if (typeof GifEncoder === 'undefined') return;
        try {
            var size = SKETCH_CONFIG.gifSize, frames = [];
            for (var f = 0; f < SKETCH_CONFIG.frameCount; f++) {
                var cv = document.createElement('canvas'); cv.width = size; cv.height = size;
                var cctx = cv.getContext('2d'), scaleToGif = size / this.baseSize;
                cctx.setTransform(scaleToGif, 0, 0, scaleToGif, 0, 0);
                cctx.fillStyle = '#fdfaf3'; cctx.fillRect(0, 0, this.baseSize, this.baseSize);
                cctx.lineCap = 'round'; cctx.lineJoin = 'round';
                this._renderFrameTo(cctx, f); frames.push(cv);
            }
            setTimeout(function() {
                try {
                    var b64 = GifEncoder.encode(frames, SKETCH_CONFIG.gifDelayMs);
                    if (!b64) return;
                    var a = document.createElement('a'); a.href = 'data:image/gif;base64,' + b64; a.download = 'sketch-' + Date.now() + '.gif';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                } catch(err) { }
            }, 50);
        } catch (e) { }
    },

    _renderFrameTo: function(ctx, phase) {
        for (var i = 0; i < this.layers.length; i++) {
            if (!this.layers[i].visible) continue;
            var strokes = this.layers[i].strokes;
            for (var s = 0; s < strokes.length; s++) {
                var st = strokes[s], pts = st.points, n = pts.length, brush = this._findBrush(st.brushId);
                var color = this._resolveColor(st.color, st.opacity);
                ctx.strokeStyle = color; ctx.fillStyle = color;
                var baseWidth = st.size * brush.widthMul;
                ctx.lineCap = brush.lineCap;

                if (n === 1) { ctx.lineWidth = baseWidth; ctx.beginPath(); var o0 = pts[0].offs[phase] || { x: 0, y: 0 }; ctx.arc(pts[0].bx + o0.x, pts[0].by + o0.y, baseWidth / 2, 0, Math.PI * 2); ctx.fill(); continue; }

                if (brush.doublePass) {
                    ctx.lineWidth = baseWidth;
                    ctx.beginPath(); var pA = pts[0], oA = pA.offs[phase] || { x: 0, y: 0 }; ctx.moveTo(pA.bx + oA.x, pA.by + oA.y);
                    for (var a = 1; a < n; a++) { pA = pts[a]; oA = pA.offs[phase] || { x: 0, y: 0 }; ctx.lineTo(pA.bx + oA.x, pA.by + oA.y); }
                    ctx.stroke(); ctx.strokeStyle = this._resolveColor(st.color, st.opacity * 0.5); ctx.lineWidth = baseWidth * 0.6;
                    ctx.beginPath(); var pB = pts[0], oB = pB.offs[phase] || { x: 0, y: 0 }; ctx.moveTo(pB.bx + oB.x, pB.by + oB.y);
                    for (var b = 1; b < n; b++) { pB = pts[b]; oB = pB.offs[phase] || { x: 0, y: 0 }; ctx.lineTo(pB.bx + oB.x, pB.by + oB.y); }
                    ctx.stroke(); continue;
                }

                if (st.dynamicWidth) {
                    ctx.lineCap = 'round';
                    for (var i2 = 1; i2 < n; i2++) {
                        var p1 = pts[i2-1], o1 = p1.offs[phase] || { x: 0, y: 0 };
                        var p2 = pts[i2], o2 = p2.offs[phase] || { x: 0, y: 0 };
                        var t = i2 / n;
                        var taper = Math.sin(t * Math.PI);
                        ctx.lineWidth = Math.max(0.5, baseWidth * (0.2 + 0.8 * taper));
                        ctx.beginPath(); ctx.moveTo(p1.bx + o1.x, p1.by + o1.y); ctx.lineTo(p2.bx + o2.x, p2.by + o2.y); ctx.stroke();
                    }
                    continue;
                }

                ctx.lineWidth = baseWidth;
                ctx.beginPath(); var p = pts[0], o = p.offs[phase] || { x: 0, y: 0 }; ctx.moveTo(p.bx + o.x, p.by + o.y);
                for (var k = 1; k < n; k++) { p = pts[k]; o = p.offs[phase] || { x: 0, y: 0 }; ctx.lineTo(p.bx + o.x, p.by + o.y); }
                ctx.stroke();
            }
        }
    }
};

var Engine = {
    initFailed: [],

    async init() {
        for (var i = 0; i < MANIFEST.modules.length; i++) {
            var name = MANIFEST.modules[i];
            var obj = window[name];
            if (obj && typeof obj.init === 'function') {
                try {
                    await obj.init();
                } catch (e) {
                    this.initFailed.push(name);
                    console.error(e);
                }
            }
        }

        for (var j = 0; j < MANIFEST.modules.length; j++) {
            var rname = MANIFEST.modules[j];
            var robj = window[rname];
            if (this.initFailed.indexOf(rname) !== -1) continue;
            if (robj && typeof robj.run === 'function') {
                var result = await robj.run();
                if (result === false || result === 'stop') break;
            }
        }
    }
};

window.addEventListener('DOMContentLoaded', async function() {
    try {
        await Engine.init();
    } catch (err) {
        console.error(err);
        var app = document.getElementById('app') || document.body;
        app.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'error';
        box.textContent = 'ошибка: ' + err.message;
        app.appendChild(box);
    }
});
    </script>
