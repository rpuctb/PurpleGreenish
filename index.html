<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>PurpleGreenish</title>

    <style>
@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

.fade-out { animation: fadeOut 0.6s forwards; }

@keyframes softPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(150,137,194,.18), 0 0 0 0 rgba(150,137,194,0); }
    50%      { box-shadow: 0 0 0 3px rgba(150,137,194,.28), 0 0 0 7px rgba(150,137,194,0); }
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #0a0d0b; color: #ddd; font-family: 'Courier New', monospace; font-size: 16px; overflow: hidden; user-select: none; }
#app { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
#app.sketch-mode { padding: 0; }
#sketch-root { position: absolute; inset: 0; overflow: hidden; background: #1f2a23; background-image: radial-gradient(circle at 50% 35%, #2b3a30 0%, #141b17 100%), radial-gradient(circle at 80% 80%, rgba(150,137,194,.04) 0%, transparent 60%), radial-gradient(circle at 20% 20%, rgba(64,131,87,.06) 0%, transparent 60%); touch-action: none; }

#sketch-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -150px;
    margin-left: -150px;
    background: #fdfaf3;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03);
    touch-action: none;
    cursor: crosshair;
    display: block;
    transform-origin: center center;
    will-change: transform;
}

#splash { position: fixed; inset: 0; background: #1f2a23; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.6s ease; }
#splash.fade-out { opacity: 0; pointer-events: none; }

#logo-wrap {
    position: relative;
    width: 120px; height: 120px;
    cursor: pointer;
    transform-origin: center center;
    transition: transform 0.15s ease-out;
    margin: 0;
    filter: drop-shadow(0 0 8px rgba(150,137,194,.35));
}
#logo-wrap svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; stroke: url(#logoGradient); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

#sketch-left, #sketch-right {
    transition: transform .28s cubic-bezier(.2,.8,.2,1),
                opacity 0.25s ease-out;
    will-change: transform, opacity;
}
#sketch-left {
    position: absolute; left: 0; top: 0; bottom: 0; width: 68px;
    background: #1a221d; border-right: 1px solid #263029;
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 0;
    transform: translateX(-100%);
    z-index: 20;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
}
#sketch-left.open { transform: translateX(0); }
#sketch-left.dimmed {
    opacity: 0;
    transition: transform .28s cubic-bezier(.2,.8,.2,1),
                opacity 0.25s ease-out;
}

#sketch-right {
    position: absolute; right: 0; top: 0; bottom: 0; width: 76px;
    background: #14181a; border-left: 1px solid #25282a;
    display: flex; flex-direction: column; gap: 8px; padding: 14px 0;
    transform: translateX(100%);
    z-index: 20;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
}
#sketch-right.open { transform: translateX(0); }
#sketch-right.dimmed {
    opacity: 0;
    transition: transform .28s cubic-bezier(.2,.8,.2,1),
                opacity 0.25s ease-out;
}

.sk-tool-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; border-radius: 12px; background: rgba(0,0,0,.25); transition: background .18s ease-out, transform .15s ease-out, box-shadow .2s ease-out; }
.sk-tool-btn svg { width: 23px; height: 23px; fill: none; stroke: rgb(64,131,87); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .18s ease-out; }
.sk-tool-btn.active { background: rgb(150,137,194); box-shadow: 0 0 0 3px rgba(150,137,194,.25), 0 4px 16px rgba(150,137,194,.4); transform: scale(1.06); }
.sk-tool-btn.active svg { stroke: #fff; }
.sk-tool-btn:active { transform: scale(.94); }

.sk-layer { width: 54px; height: 54px; margin: 0 auto; background: #1d2226; border: 2px solid #2c3236; border-radius: 10px; cursor: pointer; font-size: 11px; color: #6d7a72; display: flex; align-items: center; justify-content: center; position: relative; transition: border-color .2s ease-out, background .2s ease-out, transform .15s ease-out, opacity .3s ease-out; }
.sk-layer:active { transform: scale(.94); }
.sk-layer.active { border-color: rgb(150,137,194); background: #262b30; color: #fff; box-shadow: 0 0 0 2px rgba(150,137,194,.2); }
.sk-layer.hidden-layer { opacity: 0.25; background: transparent; border-style: dashed; }
.sk-layer .sk-eye { position: absolute; top: 1px; right: 2px; font-size: 16px; color: #6d7a72; padding: 4px; line-height: 1; }
.sk-layer.active .sk-eye { color: rgb(150,137,194); }
.sk-right-divider { height: 1px; background: #25282a; margin: 4px 12px; }

#sk-edge-left, #sk-edge-right { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 80px; border: none; color: #fff; font-size: 18px; cursor: pointer; z-index: 15; display: flex; align-items: center; justify-content: center; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .4s ease-out; }
#sk-edge-left { left: 0; background: rgba(64,131,87,.85); border-top-right-radius: 10px; border-bottom-right-radius: 10px; box-shadow: 2px 0 12px rgba(0,0,0,.35); }
#sk-edge-right { right: 0; background: rgba(60,58,72,.85); border-top-left-radius: 10px; border-bottom-left-radius: 10px; box-shadow: -2px 0 12px rgba(0,0,0,.35); }
#sk-edge-left.idle:not(.shift), #sk-edge-right.idle:not(.shift) { opacity: 0; }
#sk-edge-left.shift { transform: translate(68px, -50%); }
#sk-edge-right.shift { transform: translate(-76px, -50%); }

#sk-brush-panel { position: absolute; left: 0; right: 0; bottom: 0; background: #1a221d; border-top: 1px solid #263029; padding: 14px 16px calc(16px + env(safe-area-inset-bottom,0px)); transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); z-index: 22; box-shadow: 0 -4px 24px rgba(0,0,0,.4); }
#sk-brush-panel.open { transform: translateY(0); }
#sk-brush-panel h4 { color: #d0e0d5; font-size: 13px; margin-bottom: 10px; font-weight: normal; }
#sk-brush-panel .sk-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
#sk-brush-panel label { color: #9fb0a5; font-size: 12px; min-width: 100px; }
#sk-brush-panel input[type=range] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: #333; border-radius: 2px; }
#sk-brush-panel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: rgb(150,137,194); border-radius: 50%; cursor: pointer; }

.sk-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; width: 100%; }
.sk-toggle-row span { color: #9fb0a5; font-size: 12px; }
.sk-pulse-btn { width: 32px !important; height: 32px !important; border-radius: 50%; border: 2px solid #444; background: #222; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s ease-out, border-color 0.2s ease-out, box-shadow 0.2s ease-out; padding: 0; }
.sk-pulse-btn svg { width: 14px !important; height: 14px !important; stroke: #666; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s ease-out; }
.sk-pulse-btn .sk-check { display: none; stroke: #fff; }
.sk-pulse-btn.on { background: rgb(150,137,194); border-color: rgb(150,137,194); animation: softPulse 2.4s ease-in-out infinite; }
.sk-pulse-btn.on svg { stroke: #fff; }
.sk-pulse-btn.on .sk-cross { display: none; }
.sk-pulse-btn.on .sk-check { display: block; }

#sk-color-panel { position: absolute; left: 0; bottom: 0; width: 260px; max-width: 82vw; background: #1a221d; border-top-right-radius: 16px; padding: 14px 14px calc(60px + env(safe-area-inset-bottom,0px)) 14px; transform: translate(-110%, 110%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 24; box-shadow: 0 4px 24px rgba(0,0,0,.4); border: 1px solid #263029; border-left: none; border-bottom: none; }
#sk-color-panel.open { transform: translate(0, 0); }
#sk-color-panel h4 { color: #d0e0d5; font-size: 12px; margin-bottom: 10px; font-weight: normal; }
.sk-color-preview { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sk-color-preview-box { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #333; flex-shrink: 0; }
.sk-color-hex { flex: 1; background: #0f1512; color: #d0e0d5; border: 1px solid #2c3236; border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 13px; outline: none; min-width: 0; }
.sk-color-hex:focus { border-color: rgb(150,137,194); }
.sk-hsb-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sk-hsb-row label { color: #9fb0a5; font-size: 11px; width: 14px; }
.sk-hsb-slider { flex: 1; height: 8px; -webkit-appearance: none; appearance: none; border-radius: 4px; outline: none; cursor: pointer; }
.sk-hsb-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #fff; border: 2px solid #222; border-radius: 50%; cursor: pointer; }
#sk-hue-slider { background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
#sk-sat-slider { background: linear-gradient(to right, #808080, #f00); }
#sk-bri-slider { background: linear-gradient(to right, #000, #f00); }
.sk-color-label { color: #9fb0a5; font-size: 11px; margin-top: 10px; margin-bottom: 6px; }
.sk-preset-row, .sk-history-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.sk-preset-dot, .sk-history-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .15s ease-out, border-color .15s ease-out; flex-shrink: 0; }
.sk-preset-dot:hover, .sk-history-dot:hover { transform: scale(1.1); }
.sk-preset-dot.active, .sk-history-dot.active { border-color: rgb(150,137,194); }
.sk-history-empty { color: #6a7a70; font-size: 11px; font-style: italic; }

.sk-color-apply-btn { position: absolute; bottom: 15px; right: 15px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: rgb(150,137,194); color: #fff; border: none; border-radius: 50%; cursor: pointer; transition: transform 0.15s ease-out, background 0.15s ease-out; box-shadow: 0 4px 12px rgba(150,137,194,0.4); }
.sk-color-apply-btn:active { transform: scale(0.94); background: rgb(64,131,87); }
.sk-color-apply-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

#sk-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 18; opacity: 0; pointer-events: none; transition: opacity .25s ease-out; }
#sk-overlay.show { opacity: 1; pointer-events: auto; }
#sk-zoom-label { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(0,0,0,.55); color: #e6e6e6; font-size: 12px; padding: 5px 14px; border-radius: 20px; z-index: 15; pointer-events: none; transition: opacity .5s ease-out; letter-spacing: 0.5px; }
#sk-zoom-label.hide { opacity: 0; }
.error { color: #ff3333; font-size: 18px; padding: 20px; text-align: center; }

.save-slot {
    width: 48px;
    height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    transition: height .25s cubic-bezier(.2,.8,.2,1);
    margin: 0 auto;
}
.save-slot.open {
    height: 104px;
    margin-top: 8px;
    overflow: visible;
}
.save-btn {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.25);
    border-radius: 12px;
    color: rgb(64,131,87);
    border: none;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.4);
    transition: opacity .2s ease-out, transform .4s cubic-bezier(.34,1.56,.64,1), background .18s ease-out;
}
.save-btn:active { transform: scale(0.9); }
.save-btn svg {
    width: 23px; height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
}
.save-btn svg text {
    fill: currentColor;
    stroke: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.6px;
}
.save-slot.open .save-btn {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
}
.save-trigger.open {
    background: rgb(150,137,194);
    box-shadow: 0 0 0 3px rgba(150,137,194,.25), 0 4px 16px rgba(150,137,194,.4);
}
.save-trigger.open svg { stroke: #fff; }
.save-trigger { transition: background .18s ease-out, box-shadow .2s ease-out; }
.save-trigger svg { transition: stroke .18s ease-out; }

#sk-brush-picker { position: absolute; left: 100%; top: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #1a221d; border: 1px solid #263029; border-left: none; border-radius: 0 14px 14px 0; box-shadow: 4px 4px 24px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transform: translateX(-10px); transition: opacity .2s ease-out, transform .26s cubic-bezier(.2,.8,.2,1); }
#sk-brush-picker.open { opacity: 1; pointer-events: auto; transform: translateX(0); }
.brush-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; padding: 0; border-radius: 12px; background: rgba(0,0,0,.25); color: rgb(64,131,87); transition: background .18s ease-out, color .18s ease-out, transform .15s ease-out, box-shadow .2s ease-out; }
.brush-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.brush-btn.active { background: rgb(150,137,194); color: #fff; box-shadow: 0 0 0 3px rgba(150,137,194,.25), 0 4px 16px rgba(150,137,194,.4); transform: scale(1.06); }
.brush-btn:active { transform: scale(.94); }

    </style>
</head>

var GifEncoder = {
    loaded: true,

    encode: function(canvases, delayMs) {
        if (!canvases || canvases.length === 0) return null;
        var w = canvases[0].width;
        var h = canvases[0].height;
        var frameCount = canvases.length;

        var allFrames = [];
        var allPixels = [];

        for (var c = 0; c < frameCount; c++) {
            var ctx = canvases[c].getContext('2d');
            var data = ctx.getImageData(0, 0, w, h).data;
            var pixels = new Array(w * h);
            for (var i = 0, p = 0; i < data.length; i += 4, p++) {
                var r = data[i];
                var g = data[i + 1];
                var b = data[i + 2];
                pixels[p] = { r: r, g: g, b: b };
                allPixels.push(pixels[p]);
            }
            allFrames.push(pixels);
        }

        var palette = this._medianCut(allPixels, 256);

        var indexedFrames = [];
        for (var f = 0; f < frameCount; f++) {
            var px = allFrames[f];
            var idx = new Uint8Array(px.length);
            for (var j = 0; j < px.length; j++) {
                idx[j] = this._nearestIndex(palette, px[j]);
            }
            indexedFrames.push(idx);
        }

        return this._buildGif(indexedFrames, palette, w, h, delayMs || 1200);
    },

    _medianCut: function(pixels, maxColors) {
        if (pixels.length === 0) return [{ r: 0, g: 0, b: 0 }];
        var buckets = [this._makeBucket(pixels)];
        while (buckets.length < maxColors) {
            var bestIdx = -1;
            var bestRange = 0;
            for (var i = 0; i < buckets.length; i++) {
                var b = buckets[i];
                if (b.pixels.length < 2) continue;
                var range = Math.max(b.rMax - b.rMin, b.gMax - b.gMin, b.bMax - b.bMin);
                if (range > bestRange) { bestRange = range; bestIdx = i; }
            }
            if (bestIdx === -1) break;
            var bucket = buckets[bestIdx];
            var rRange = bucket.rMax - bucket.rMin;
            var gRange = bucket.gMax - bucket.gMin;
            var bRange = bucket.bMax - bucket.bMin;
            var channel = 'r';
            if (gRange >= rRange && gRange >= bRange) channel = 'g';
            else if (bRange >= rRange && bRange >= gRange) channel = 'b';
            bucket.pixels.sort(function(a, b) { return a[channel] - b[channel]; });

            var sr = 0, sg = 0, sb = 0;
            for (var m = 0; m < bk.pixels.length; m++) {
                sr += bk.pixels[m].r;
                sg += bk.pixels[m].g;
                sb += bk.pixels[m].b;
            }
            palette.push({
                r: Math.round(sr / bk.pixels.length),
                g: Math.round(sg / bk.pixels.length),
                b: Math.round(sb / bk.pixels.length)
            });
        }
        return palette;
    },

    _makeBucket: function(pixels) {
        if (pixels.length === 0) return { pixels: [], rMin: 0, rMax: 0, gMin: 0, gMax: 0, bMin: 0, bMax: 0 };
        var rMin = 255, rMax = 0, gMin = 255, gMax = 0, bMin = 255, bMax = 0;
        for (var i = 0; i < pixels.length; i++) {
            var p = pixels[i];
            if (p.r < rMin) rMin = p.r;
            if (p.r > rMax) rMax = p.r;
            if (p.g < gMin) gMin = p.g;
            if (p.g > gMax) gMax = p.g;
            if (p.b < bMin) bMin = p.b;
            if (p.b > bMax) bMax = p.b;
        }
        return { pixels: pixels, rMin: rMin, rMax: rMax, gMin: gMin, gMax: gMax, bMin: bMin, bMax: bMax };

    _nearestIndex: function(palette, color) {
        var best = 0;
        var bestDist = Infinity;
        for (var i = 0; i < palette.length; i++) {
            var p = palette[i];
            var dr = p.r - color.r;
            var dg = p.g - color.g;
            var db = p.b - color.b;
            var dist = dr * dr + dg * dg + db * db;
            if (dist < bestDist) { bestDist = dist; best = i; }
        }
        return best;
    },

    _buildGif: function(frames, palette, w, h, delayMs) {
        var out = [];
        out.push(0x47, 0x49, 0x46, 0x38, 0x39, 0x61);
        out.push(w & 0xFF, (w >> 8) & 0xFF);
        out.push(h & 0xFF, (h >> 8) & 0xFF);
        out.push(0xF7, 0x00, 0x00);
        for (var i = 0; i < 256; i++) {
            var col = palette[i] || { r: 0, g: 0, b: 0 };
            out.push(col.r, col.g, col.b);
        }
        out.push(0x21, 0xFF, 0x0B);
        var appId = [0x4E, 0x45, 0x54, 0x53, 0x43, 0x41, 0x50, 0x45, 0x32, 0x2E, 0x30];
        for (var a = 0; a < appId.length; a++) out.push(appId[a]);

            out.push(0x21, 0xF9, 0x04);
            out.push(0x04);
            out.push(delayCs & 0xFF, (delayCs >> 8) & 0xFF);
            out.push(0x00);
            out.push(0x00);
            out.push(0x2C);
            out.push(0x00, 0x00, 0x00, 0x00);
            out.push(w & 0xFF, (w >> 8) & 0xFF);
            out.push(h & 0xFF, (h >> 8) & 0xFF);

                out.push(chunk);
                for (var k = 0; k < chunk; k++) out.push(lzw[off + k]);

    _lzwEncode: function(indices, minCodeSize) {
        var CLEAR = 1 << minCodeSize;
        var END = CLEAR + 1;
        var codeSize = minCodeSize + 1;
        var out = [];
        var bitBuf = 0;
        var bitCount = 0;
        function pushCode(code) {
            bitBuf |= (code << bitCount);

                bitBuf >>= 8;
                bitCount -= 8;
            }

        var nextCode = END + 1;

            dict = {};
            nextCode = END + 1;
            codeSize = minCodeSize + 1;
        }
        pushCode(CLEAR);
        if (indices.length === 0) {
            pushCode(END);
            if (bitCount > 0) out.push(bitBuf & 0xFF);
            return out;
        }
        var prefix = indices[0];
        for (var i = 1; i < indices.length; i++) {
            var ch = indices[i];
            var key = prefix + ',' + ch;
            if (dict[key] !== undefined) {
                prefix = dict[key];
            } else {
                pushCode(prefix);
                dict[key] = nextCode++;
                if (nextCode - 1 === (1 << codeSize) && codeSize < 12) codeSize++;
                if (nextCode >= 4096) { pushCode(CLEAR); reset(); }

            }
        }
        pushCode(prefix);
        pushCode(END);
        if (bitCount > 0) out.push(bitBuf & 0xFF);
        return out;
    }

    try {
        await Engine.init();
    } catch (err) {
        console.error(err);
        var app = document.getElementById('app') || document.body;
        app.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'error';
        box.textContent = 'ошибка: ' + err.message;
        app.appendChild(box);
    }
});
    </script>
</body>
